<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Citizen Grievance Portal{% endblock %}</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#e4e7ec;--brand:#1d4ed8;--hi:#b42318;--hi-bg:#fee4e2;--md:#b54708;--md-bg:#fef0c7;--lo:#067647;--lo-bg:#d1fadf}
  @media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--ink:#e6eaf0;--mute:#98a2b3;--line:#2a3441;--brand:#6c9bff;--hi:#fda29b;--hi-bg:#3b1a17;--md:#fec84b;--md-bg:#3a2a0a;--lo:#75e0a7;--lo-bg:#0d2e1f}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Kannada",sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}
  nav{display:flex;gap:20px;align-items:center;height:56px}
  nav b{font-size:16px;margin-right:auto}
  nav a{color:var(--mute);text-decoration:none;font-weight:500}
  nav a.on,nav a:hover{color:var(--brand)}
  main{padding:24px 0 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 12px}
  .mute{color:var(--mute)}
  textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
  textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px}
  button,.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line);padding:4px 10px;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:999px;font-size:13px;cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .High{background:var(--hi-bg);color:var(--hi)} .Medium{background:var(--md-bg);color:var(--md)} .Low{background:var(--lo-bg);color:var(--lo)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kv{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
  .kv+div{font-weight:600;margin-top:2px}
  .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--brand)}
  .reply{white-space:pre-wrap;border-left:3px solid var(--brand);padding:4px 0 4px 14px}
  .warn{background:var(--md-bg);color:var(--md);padding:10px 14px;border-radius:8px;margin-bottom:12px}
  .err{background:var(--hi-bg);color:var(--hi);padding:10px 14px;border-radius:8px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
  select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
  .tbl{overflow-x:auto}
  details summary{cursor:pointer;color:var(--brand);font-weight:500}
  code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;margin:8px 0 0}
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <b>Citizen Grievance Portal</b>
  <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint=='index' }}">Submit complaint</a>
  <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint=='dashboard' }}">Officer dashboard</a>
</nav></div></header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
</body>
</html>
